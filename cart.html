<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart & Checkout | Enafu Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { navy: '#071A2B', orange: '#FF7A00', bgLight: '#F7F9FC', slate: '#334155', border: '#E2E8F0' } },
          fontFamily: { sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-brand-bgLight font-sans text-brand-slate antialiased">

  <header class="bg-white border-b border-brand-border sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="font-extrabold text-xl text-brand-navy">Enafu<span class="text-brand-orange">Store</span></a>
      <a href="shop.html" class="text-xs font-bold bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-xl transition">&larr; Continue Shopping</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="text-2xl font-extrabold text-brand-navy mb-6">Your Shopping Cart</h1>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <div id="cartItemsList" class="lg:col-span-2 bg-white rounded-2xl border border-brand-border p-6 space-y-4 divide-y divide-slate-100"></div>
      
      <div class="bg-white rounded-2xl border border-brand-border p-6 h-max space-y-4">
        <h2 class="font-bold text-sm text-brand-navy uppercase tracking-wider">Order Summary</h2>
        <div class="flex justify-between text-sm font-bold text-brand-navy pt-2 border-t border-brand-border">
          <span>Subtotal</span>
          <span id="cartSubtotal">Rs. 0</span>
        </div>
        
        <form id="checkoutForm" onsubmit="processOrder(event)" class="space-y-3 pt-4 border-t border-brand-border text-xs">
          <div><label class="block font-bold text-slate-700 mb-1">Full Name *</label><input type="text" id="custName" required class="w-full bg-slate-50 border border-brand-border rounded-xl px-3 py-2"></div>
          <div><label class="block font-bold text-slate-700 mb-1">WhatsApp Number *</label><input type="tel" id="custPhone" placeholder="03XXXXXXXXX" required class="w-full bg-slate-50 border border-brand-border rounded-xl px-3 py-2"></div>
          <div><label class="block font-bold text-slate-700 mb-1">Delivery Address *</label><input type="text" id="custAddress" required class="w-full bg-slate-50 border border-brand-border rounded-xl px-3 py-2"></div>
          <div><label class="block font-bold text-slate-700 mb-1">City *</label><input type="text" id="custCity" required class="w-full bg-slate-50 border border-brand-border rounded-xl px-3 py-2"></div>
          <button type="submit" class="w-full bg-brand-orange hover:bg-orange-600 text-white font-extrabold py-3.5 rounded-xl uppercase tracking-wider transition shadow-md cursor-pointer">Place WhatsApp Order</button>
        </form>
      </div>
    </div>
  </main>

  <script src="shop-data.js"></script>
</body>
</html>
