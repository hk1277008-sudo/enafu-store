<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details | Enafu Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {

          fontFamily: { sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'] }
        }
      }
    }

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body class="bg-white font-sans text-brand-slate antialiased">

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div id="productDetailContainer" class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-start"></div>

  <script src="shop-data.js"></script>

</html>
