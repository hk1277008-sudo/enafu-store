<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Catalog | Enafu Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { navy: '#071A2B', orange: '#FF7A00', bgLight: '#F7F9FC', slate: '#334155', border: '#E2E8F0' } },
          fontFamily: { sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body class="bg-white font-sans text-brand-slate antialiased">
  <header class="bg-white/90 backdrop-blur-md border-b border-brand-border sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-3">
        <div class="h-10 px-2.5 rounded-xl bg-brand-navy flex items-center justify-center text-brand-orange font-bold text-lg">E</div>
        <span class="font-extrabold text-xl text-brand-navy">Enafu<span class="text-brand-orange">Store</span></span>
      </a>
      <nav class="hidden md:flex items-center gap-7 font-semibold text-slate-700 text-xs">
        <a href="index.html" class="hover:text-brand-orange">Home</a>
        <a href="shop.html" class="text-brand-orange font-bold">Shop Catalog</a>
        <a href="about.html" class="hover:text-brand-orange">About Us</a>
        <a href="contact.html" class="hover:text-brand-orange">Contact</a>
      </nav>
      <div class="flex items-center gap-3">
        <button onclick="toggleCartDrawer()" class="p-2 bg-slate-100 rounded-xl relative flex items-center gap-2">
          🛒 <span id="cartBadge" class="bg-brand-orange text-white text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="text-3xl font-extrabold text-brand-navy mb-6">Full Product Catalog</h1>
    <div id="catalogGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
  </main>

  <footer class="bg-brand-navy text-white py-12 border-t border-brand-border text-xs mt-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-slate-500">
      <p>&copy; 2026 Enafu Store. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
