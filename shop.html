<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Catalog | Enafu Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { navy: '#071A2B', orange: '#FF7A00', bgLight: '#F7F9FC', slate: '#334155', border: '#E2E8F0' } },
          fontFamily: { sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-brand-bgLight font-sans text-brand-slate antialiased">

  <!-- HEADER -->
  <header class="bg-white/90 backdrop-blur-md border-b border-brand-border sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-3">
        <div class="h-10 px-2.5 rounded-xl bg-brand-navy flex items-center justify-center shadow-md">
          <span class="text-brand-orange font-extrabold text-xl">E</span>
        </div>
        <span class="font-extrabold text-xl text-brand-navy">Enafu<span class="text-brand-orange">Store</span></span>
      </a>
      <div class="flex-1 max-w-md mx-6">
        <input type="text" id="globalSearch" oninput="filterCatalog()" placeholder="Search 13 products..." class="w-full bg-slate-50 border border-brand-border rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-brand-navy" />
      </div>
      <a href="cart.html" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl relative flex items-center gap-2">
        <svg class="w-5 h-5 text-brand-navy" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        <span id="cartBadge" class="bg-brand-orange text-white text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
      </a>
    </div>
  </header>

  <!-- CATALOG GRID -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="mb-8">
      <span class="text-brand-orange text-xs font-bold uppercase tracking-wider">Full Inventory</span>
      <h1 class="text-3xl font-extrabold text-brand-navy mt-1">Smart Electrical & Home Catalog</h1>
    </div>
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  </main>

  <script src="shop-data.js"></script>
</body>
</html>
